<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>sugarpinkcloud</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #a8c8e8 0%, #fce4ec 70%, #fff5e1 100%);
      font-family: -apple-system, "Segoe UI", sans-serif;
      color: #6a5a7a;
    }
    h1 {
      font-weight: 300;
      font-size: 3rem;
      letter-spacing: 4px;
      margin: 0;
    }
    p {
      margin-top: 1rem;
      font-size: 1rem;
      letter-spacing: 2px;
      opacity: 0.7;
    }
    .heart {
      margin-top: 2rem;
      font-size: 1.5rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <h1>sugarpinkcloud ✿</h1>
  <p>welcome to my little corner</p>
  <div class="heart">🌸</div>
</body>
</html>
